<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CHEEZE LAB - Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Modal -->
    <div id="login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:8px; text-align:center; width:300px;">
            <h2>THE CHEEZE LAB</h2>
            <p>Login to Access POS</p>
            <input type="text" id="username" placeholder="Username" style="width:90%; padding:10px; margin-bottom:10px;">
            <input type="password" id="password" placeholder="Password" style="width:90%; padding:10px; margin-bottom:15px;">
            <button onclick="loginUser()" style="width:100%; background:#ff4757; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">Login</button>
            <p id="login-error" style="color:red; font-size:12px; margin-top:10px; display:none;">Invalid Credentials!</p>
        </div>
    </div>

    <!-- Header Section -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem;">
        <div>
            <h1 style="margin:0;">🍕 THE CHEEZE LAB 🍔</h1>
            <p style="margin:0;">Fast Food Redefined</p>
        </div>
        <div id="user-info" style="display:none;">
            <span id="logged-user" style="font-weight:bold; margin-right:10px;"></span>
            <button onclick="logoutUser()" style="background:black; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Menu Section -->
        <div class="menu-section">
            <h2>Menu Categories</h2>
            <div id="menu-container"></div>
        </div>

        <!-- Order Summary Section -->
        <div class="order-section">
            <h2>Current Order</h2>
            <ul id="order-list"></ul>
            <hr>
            <h3>Total: Rs. <span id="total-price">0</span></h3>
            
            <button class="action-btn print-btn" onclick="printOnly()">
                🖨️ Print Receipt Only
            </button>

            <button class="action-btn pay-btn" onclick="savePaidOrder()">
                💳 Mark as Paid & Save History
            </button>
        </div>
    </div>

    <!-- Permanent History Log -->
    <div class="history-section" style="display:none;">
        <div class="history-header">
            <h2>Permanent Sales History Log</h2>
            <div>
                <button id="admin-clear-btn" onclick="clearHistoryByAdmin()" style="background: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; display: none;">
                    🗑️ Clear History (Admin Only)
                </button>
                <button class="export-btn" onclick="exportToCSV()">
                    📊 Download Excel History
                </button>
            </div>
        </div>
        
        <table border="1" class="history-table">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Items Ordered</th>
                    <th>Total Amount</th>
                </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
