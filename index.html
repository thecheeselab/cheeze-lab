<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CHEEZE LAB - Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Modal -->
    <div id="login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:8px; text-align:center; width:300px;">
            <img src="logo.png" alt="Cheeze Lab Logo" style="width:100px; height:100px; border-radius:50%; margin-bottom:10px;">
            <h2 style="margin: 5px 0;">THE CHEEZE LAB</h2>
            <p style="margin-bottom:15px; color:#666;">Login to Access POS</p>
            <input type="text" id="username" placeholder="Username" style="width:90%; padding:10px; margin-bottom:10px;">
            <input type="password" id="password" placeholder="Password" style="width:90%; padding:10px; margin-bottom:15px;">
            <button onclick="loginUser()" style="width:100%; background:#ff4757; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">Login</button>
            <p id="login-error" style="color:red; font-size:12px; margin-top:10px; display:none;">Invalid Credentials!</p>
        </div>
    </div>

    <!-- Header Section -->
    <header style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem;">
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="logo.png" alt="Cheeze Lab Logo" style="width:50px; height:50px; border-radius:50%;">
            <div>
                <h1 style="margin:0;">THE CHEEZE LAB</h1>
                <p style="margin:0; font-size:12px;">TASTE IT. LOVE IT. CRAVE IT.</p>
            </div>
        </div>
        <div id="user-info" style="display:none;">
            <span id="logged-user" style="font-weight:bold; margin-right:10px;"></span>
            <button onclick="logoutUser()" style="background:black; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Logout</button>
        </div>
    </header>

    <!-- Multi-Order Tabs Bar -->
    <div class="tabs-bar">
        <span style="font-weight:bold; margin-right:10px; align-self:center;">Active Orders:</span>
        <div id="order-tabs-list" style="display:flex; gap:5px; align-items:center; overflow-x:auto;"></div>
        <button onclick="createNewOrderTab()" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:10px;">+ New Order</button>
    </div>

    <div class="container">
        <!-- Menu Section -->
        <div class="menu-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                <h2 style="margin:0;">Menu Categories</h2>
                <!-- Menu Search Bar -->
                <input type="text" id="menu-search-input" onkeyup="filterMenu()" placeholder="🔍 Search menu item..." style="padding:8px 12px; border-radius:20px; border:1px solid #ccc; width:220px; font-size:14px;">
            </div>
            <div id="menu-container"></div>
        </div>

        <!-- Order Summary Section -->
        <div class="order-section">
            <!-- Receipt Logo -->
            <img src="logo.png" alt="THE CHEEZE LAB" class="receipt-logo">
            
            <h2 id="receipt-order-title">Current Order</h2>

            <!-- Customer Details & Order Type Input -->
            <div class="order-inputs">
                <label style="font-weight:bold; font-size:13px;">Customer Name:</label>
                <input type="text" id="customer-name" placeholder="Enter Customer Name" onchange="updateCurrentOrderMeta()" style="width:100%; padding:8px; margin:5px 0 10px 0; box-sizing:border-box;">

                <label style="font-weight:bold; font-size:13px;">Order Type:</label>
                <select id="order-type" onchange="updateCurrentOrderMeta()" style="width:100%; padding:8px; margin:5px 0 10px 0; box-sizing:border-box;">
                    <option value="Dine-in">Dine-in</option>
                    <option value="Takeaway">Takeaway</option>
                    <option value="Delivery">Delivery</option>
                </select>
            </div>

            <!-- Printable Receipt Header Info -->
            <div id="receipt-meta-print" style="display:none; text-align:left; font-size:14px; margin-bottom:10px;">
                <p style="margin:2px 0;"><strong>Customer:</strong> <span id="print-cust-name">-</span></p>
                <p style="margin:2px 0;"><strong>Type:</strong> <span id="print-order-type">-</span></p>
            </div>

            <ul id="order-list"></ul>
            <hr>
            <h3>Total: Rs. <span id="total-price">0</span></h3>
            
            <button class="action-btn print-btn" onclick="printOnly()">
                🖨️ Print Receipt Only
            </button>

            <button class="action-btn pay-btn" onclick="savePaidOrder()">
                💳 Mark as Paid & Save History
            </button>
        </div>
    </div>

    <!-- Sales History Log -->
    <div class="history-section">
        <div class="history-header" style="flex-wrap:wrap; gap:10px;">
            <h2>Sales History Log</h2>
            
            <!-- Calendar Filter -->
            <div style="display:flex; align-items:center; gap:8px;">
                <label for="history-date-filter" style="font-weight:bold; font-size:14px;">📅 Filter Date:</label>
                <input type="date" id="history-date-filter" onchange="filterHistoryByDate()" style="padding:6px 10px; border-radius:4px; border:1px solid #ccc;">
                <button onclick="clearDateFilter()" style="padding:6px 10px; background:#747d8c; color:white; border:none; border-radius:4px; cursor:pointer;">Show All</button>
            </div>

            <div>
                <button id="admin-clear-btn" onclick="clearHistoryByAdmin()" style="background: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; display: none;">
                    🗑️ Clear History (Admin Only)
                </button>
                <button class="export-btn" onclick="exportToCSV()">
                    📊 Download Excel History
                </button>
            </div>
        </div>
        
        <table border="1" class="history-table">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Customer Name</th>
                    <th>Order Type</th>
                    <th>Items Ordered</th>
                    <th>Total Amount</th>
                </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
